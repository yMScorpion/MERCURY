trading:
  kelly_fraction_multiplier: 0.50
  min_net_spread_threshold: "0.06"
  max_single_trade_pct: "0.10"
  max_daily_loss_pct: "0.03"
  max_drawdown_pct: "0.10"
  max_platform_exposure_pct: "0.40"
  stale_data_timeout_ms: 5000
  max_concurrent_arbs: 300
  gas_price_max_gwei: 200
  rebalance_threshold_pct: "0.15"
  max_open_positions: 500000
  initial_bankroll: "100.00"

platforms:
  polymarket:
    enabled: true
    rest_url: "https://clob.polymarket.com"
    ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
    sports_ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/sports"
  kalshi:
    enabled: true
    rest_url: "https://api.elections.kalshi.com/trade-api/v2"
    ws_url: "wss://api.elections.kalshi.com/trade-api/ws/v2"
  cdna:
    enabled: false
    rest_url: ""
    ws_url: ""
  forecastex:
    enabled: false
    fix_host: ""
    fix_port: 0

database:
  path: "mercury_dry_run.db"
  pool_size: 4
  busy_timeout_ms: 5000

telegram:
  enabled: true
  daily_report_hour_utc: 21

polygon_rpc:
  url: "https://rpc.ankr.com/polygon"
  gas_poll_interval_secs: 15

logging:
  level: "info"
  file: "logs/mercury_dry_run.log"

health:
  port: 9091
