[package]
name = "mercury"
version = "0.1.0"
edition = "2021"
description = "Cross-market prediction arbitrage engine"

[dependencies]
# Async runtime & execution
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
async-trait = "0.1"

# Error handling & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"

# Numerics & time
rust_decimal = { version = "1", features = ["maths", "serde-with-str"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }

# Data structures & caching
uuid = { version = "1", features = ["v4", "serde"] }
arrayvec = { version = "0.7", features = ["serde"] }
lru = "0.12.5"
dashmap = "6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "chrono", "uuid", "rust_decimal"] }

# Networking & HTTP
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
native-tls = "0.2"
tokio-native-tls = "0.3"

# File watching
notify = "6"

# Environment
dotenvy = "0.15"

# Crypto & Security
alloy = { version = "0.8.2", features = ["full", "eip712"] }
alloy-sol-types = "0.8.26"
hex = "0.4"
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
sha2 = "0.10"
ring = "0.17"
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }
base64 = "0.22.1"
hmac = "0.13.0"
regex = "1.12.3"

[dev-dependencies]
proptest = "1.4"
insta = { version = "1.34", features = ["json"] }
criterion = "0.5"

[[bench]]
name = "engine_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
